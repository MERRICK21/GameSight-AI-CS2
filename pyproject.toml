[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesight-ai-cs2"
version = "0.1.0"
description = "Modular CS2 POV video analysis system."
requires-python = ">=3.11"

[project.scripts]
gamesight-knowledge = "gamesight.knowledge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
